name: Publish Python wrapper

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag (for example 2.6.1 or v2.6.1)"
        required: true
        type: string
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish PyPI core
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Verify synchronized release version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: python scripts/check_release_versions.py --tag "$RELEASE_VERSION"

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
